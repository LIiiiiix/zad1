spring:
  application:
    name: "CTVД-657867" # Оставь своё имя приложения

  # === КРИТИЧЕСКИ ВАЖНОЕ ИЗМЕНЕНИЕ ===
  # Отключаем автоматическую настройку безопасности, чтобы она не мешала нашему AuthService
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/zad1_db
    username: zad1_user
    password: Johnny2077
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop # База будет очищаться при каждом старте (это нормально для теста)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# === ЛОГИРОВАНИЕ ДЛЯ ОТЛАДКИ ===
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG  # Показывает причины отказов доступа
    com.example.zad1: DEBUG              # Логи нашего кода